@if (taskService.isModalOpen()) {
  <div class="modal-backdrop" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <header class="modal-header">
        <h2>{{ taskService.taskToEdit() ? 'Edit Task' : 'Create New Task' }}</h2>
        <button class="close-btn" (click)="close()" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <form (submit)="$event.preventDefault(); submitTask()" class="modal-form">
        <div class="form-group main-input">
          <label for="task-title">Task Title</label>
          <input 
            id="task-title"
            name="title"
            type="text" 
            placeholder="What needs to be done?" 
            [ngModel]="newTitle()" 
            (ngModelChange)="newTitle.set($event)"
            required
            autofocus
          />
        </div>
        
        <div class="form-grid">
          <div class="form-group">
            <label for="task-category">Category</label>
            <select 
              id="task-category" 
              name="category" 
              [ngModel]="newCategory()" 
              (ngModelChange)="newCategory.set($event)"
            >
              @for (cat of taskService.categories(); track cat.id) {
                <option [value]="cat.name">{{ cat.icon }} {{ cat.name }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority" [ngModel]="newPriority()" (ngModelChange)="newPriority.set($event)">
              <option value="low">Low Priority</option>
              <option value="medium">Medium Priority</option>
              <option value="high">High Priority</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="task-date">Due Date</label>
          <input 
            id="task-date"
            name="dueDate"
            type="date" 
            [ngModel]="newDueDate()" 
            (ngModelChange)="newDueDate.set($event)"
          />
        </div>

        <div class="modal-actions">
          <button type="button" class="cancel-btn" (click)="close()">Cancel</button>
          <button type="submit" class="submit-btn">
            @if (taskService.taskToEdit()) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                <polyline points="17 21 17 13 7 13 7 21"></polyline>
                <polyline points="7 3 7 8 15 8"></polyline>
              </svg>
              Save Changes
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              Add Task
            }
          </button>
        </div>
      </form>
    </div>
  </div>
}
